version = 1

# Code-review-automation trial (PLAN-008). Enables DeepSource's Java analyzer so
# the platform analyzes the WebGoat lesson code. Application-only scope: the CI
# harness, build output and tests are excluded so counts match the app-only
# ground truth (src/main/**). DeepSource results are collected via its dashboard
# / API (owner step 1.3) — this file only makes the config ready.

exclude_patterns = [
  ".github/**",
  "target/**",
  "src/test/**",
  "src/it/**"
]

[[analyzers]]
name = "java"
enabled = true

  [analyzers.meta]
  runtime_version = "25"

[[analyzers]]
name = "secrets"
enabled = true

[[analyzers]]
name = "test-coverage"
enabled = false
